plugins {
    id 'net.neoforged.moddev' version '2.0.134' apply false
    id 'org.spongepowered.mixin' version '0.7.+' apply false
    id 'com.modrinth.minotaur' version '2.+' apply false
    id 'net.darkhax.curseforgegradle' version '1.1.18' apply false
}

// Tarea wrapper solo en root
tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

// Configuración común para todos los submódulos
subprojects {
    apply plugin: 'java-library'
    apply plugin: 'eclipse'
    apply plugin: 'idea'
    apply plugin: 'maven-publish'
    apply plugin: 'net.neoforged.moddev'

    // Repositorios comunes
    repositories {
        mavenCentral()
        maven {
            name = 'Sponge / Mixin'
            url = 'https://repo.spongepowered.org/repository/maven-public/'
        }
        maven {
            url = "https://maven.neoforged.net/releases/"
        }
        maven {
            name = "Modrinth"
            url = "https://api.modrinth.com/maven/"
            content {
                includeGroup "maven.modrinth"
            }
        }
        maven {
            url = "https://maven.maxhenkel.de/repository/public/"
        }
        maven {
            name = "Curse Maven"
            url = "https://www.cursemaven.com"
            content {
                includeGroup "curse.maven"
            }
        }
    }

    // Java 21 para todos los módulos
    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
        withSourcesJar()
        withJavadocJar()
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }

    // Configuración de IDEA
    idea {
        module {
            downloadSources = true
            downloadJavadoc = true
        }
    }
}